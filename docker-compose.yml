services:
  halo:
    build:
      context: ./deploy
      args:
        TARGETARCH: amd64
    image: chupathingyce-server
    container_name: halo
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ./data:/data
    environment:
      HALO_SAVE_ROOT: /data/saves
      HALO_DEDICATED: ${HALO_DEDICATED:-playlists/friends.txt}
      HALO_DEDICATED_NAME: ${HALO_DEDICATED_NAME:-Friends Halo}
      HALO_DEDICATED_PUBLIC: ${HALO_DEDICATED_PUBLIC:-false}
      HALO_DEDICATED_MAXIMUM_PLAYERS: ${HALO_DEDICATED_MAXIMUM_PLAYERS:-16}
      HALO_DEDICATED_MINIMUM_PLAYERS: ${HALO_DEDICATED_MINIMUM_PLAYERS:-1}
      HALO_NET_TUNNEL_PORT: ${HALO_NET_TUNNEL_PORT:-2302}
      HALO_DEDICATED_CONTROL: ${HALO_DEDICATED_CONTROL:-8080}
